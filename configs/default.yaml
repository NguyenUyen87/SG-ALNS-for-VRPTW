# SG-ALNS default configuration (override from CLI with --set section.key=value)
env:
  T: 2500            # ALNS iterations per training episode
  K: 50              # segment length (decision interval)
  sizes: [50, 100]   # training instance sizes (random mix of R / C / RC, narrow / wide windows)
  red_iters: null    # shared vehicle-reduction phase: null = 10n iterations (same as evaluation)
  p_main: 0.7        # probability of the "lead" operator inside a segment
  use_a2: true       # learn destroy ratio
  use_a3: true       # learn temperature multiplier
  dyn: true          # dynamic time-window features (wait, slack, FTS)
  reward: td         # td: 100*(TD_prev-TD)/TD_init + lam*dNV (hierarchical) | f: 100*(f_prev-f)/f_init + lam*dNV
  lam_nv: 5.0
  use_a1: true
model:
  h: 64
  layers: 3
  encoder: gnn       # gnn | mlp
ppo:
  n_envs: 8
  episodes: 2400       # 300 PPO updates of 8 episodes (paper)
  lr: 3.0e-4
  gamma: 0.99
  lam: 0.95
  clip: 0.2
  epochs: 4
  minibatch: 256
  ent_start: 0.01
  ent_end: 0.001
  val_every: 5
  val_instances: 24
  val_size: 100
  torch_threads: 2
  curriculum: true         # first 40 % of updates on sizes[0], then the full size mix
  curriculum_switch: 0.4
  max_minutes: 0           # wall-clock cap (0 = none)
bdq:                       # segment-level Branching Dueling Double DQN (algo: bdq)
  n_envs: 8
  episodes: 2400
  lr: 1.0e-4
  gamma: 0.99
  batch: 64
  buffer: 12000
  target_every: 500
  updates_per_step: 2
  eps_start: 1.0
  eps_end: 0.05
  eps_frac: 0.5
  val_every: 5
  val_instances: 24
  val_size: 100
  torch_threads: 2
  curriculum: true
  curriculum_switch: 0.4
algo: ppo                  # ppo | bdq
seed: 0
